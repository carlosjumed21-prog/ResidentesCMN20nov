<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tu Nombre - Tarjeta de Presentación</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center; max-width: 300px; }
        h1 { margin-bottom: 5px; color: #333; }
        p { color: #666; font-size: 14px; }
        a { display: inline-block; margin-top: 15px; padding: 10px 20px; background: #007bff; color: white; text-decoration: none; border-radius: 5px; }
        a:hover { background: #0056b3; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Tu Nombre</h1>
        <p>Desarrollador / Diseñador / Profesional</p>
        <p>¡Bienvenido a mi tarjeta digital!</p>
        <a href="mailto:tu-correo@example.com">Contáctame</a>
    </div>
</body>
</html>
